<!doctype html>
<html lang="en" class="bg-[#0c0e14]" style="background-color: #0c0e14; color: #f4f4f5;">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>The Comedy Button</title>
    <meta name="description" content="The 24/7 live radio broadcast and complete episode archive for The Comedy Button podcast, featuring all 560+ episodes and synchronized live radio." />
    <meta property="og:title" content="The Comedy Button" />
    <meta property="og:description" content="The 24/7 live radio broadcast and complete episode archive for The Comedy Button podcast, featuring all 560+ episodes and synchronized live radio." />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />

    <!-- Immediate dark canvas style guard to guarantee zero white screen flash -->
    <style>
      html, body {
        background-color: #0c0e14 !important;
        color: #f4f4f5 !important;
        margin: 0;
        padding: 0;
        min-height: 100vh;
        overflow-x: hidden;
      }
    </style>

    <!-- Mobile & PWA Optimization Tags -->
    <meta name="theme-color" content="#0e111a" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="ComedyButton" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="icon" type="image/svg+xml" href="/icon.svg" />
    <link rel="icon" type="image/png" sizes="192x192" href="/pwa-192x192.png" />
    <link rel="icon" type="image/jpeg" href="https://static.libsyn.com/p/assets/4/b/9/9/4b995a114aac0a5b/ComedyButton-2015-iTunes-icon-1400x1400.jpg" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:ital,wght@0,400;0,500;0,600;0,700;0,800;1,400&family=Bungee&display=swap" rel="stylesheet">

    <!-- Global safety recovery script in case any external resource fails -->
    <script>
      window.addEventListener('error', function(e) {
        console.error('[TCB] Uncaught runtime script exception:', e.error || e.message);
        try {
          var root = document.getElementById('root');
          if (root && (!root.firstElementChild || root.innerHTML.indexOf('cb-splash-slide') !== -1)) {
            root.innerHTML = '<div style="min-height:100vh;background-color:#0c0e14;color:#f4f4f5;display:flex;align-items:center;justify-content:center;padding:24px;font-family:\'Plus Jakarta Sans\',system-ui,-apple-system,sans-serif;"><div style="background:#121520;border:1px solid #27272a;border-radius:24px;padding:32px;max-width:480px;text-align:center;box-shadow:0 25px 50px -12px rgba(0,0,0,0.5);"><div style="width:52px;height:52px;border-radius:16px;background:#dc2626;color:white;display:flex;align-items:center;justify-content:center;margin:0 auto 16px auto;font-weight:900;font-size:22px;">CB</div><h2 style="font-size:18px;font-weight:800;margin:0 0 8px 0;">The Comedy Button Player</h2><p style="font-size:13px;color:#a1a1aa;margin:0 0 20px 0;line-height:1.5;">An unexpected issue interrupted startup. Click below to refresh the broadcast feed.</p><button onclick="window.location.reload()" style="background:#dc2626;color:white;border:none;border-radius:12px;padding:10px 22px;font-weight:700;font-size:13px;cursor:pointer;">Reload Player</button></div></div>';
          }
        } catch (_) {}
      });
    </script>

    <!-- Google Cast Web Sender SDK for Chromecast, Nest & Smart Speakers (async/defer with silent fallback) -->
    <script async defer src="https://www.gstatic.com/cv/js/sender/v1/cast_sender.js?loadCastFramework=1" onerror="console.warn('[TCB] Google Cast SDK deferred')"></script>
  </head>
  <body class="bg-[#0c0e14] text-zinc-100 min-h-screen antialiased select-none" style="background-color: #0c0e14; color: #f4f4f5; margin: 0; min-height: 100vh; overflow-x: hidden;">
    <div id="root" class="min-h-screen">
      <!-- High-performance inline splash so user never sees a white screen during initial cold load -->
      <div style="min-height: 100vh; background-color: #0c0e14; display: flex; flex-direction: column; align-items: center; justify-content: center; font-family: 'Plus Jakarta Sans', system-ui, -apple-system, sans-serif; padding: 24px;">
        <div style="display: flex; align-items: center; gap: 14px; margin-bottom: 20px;">
          <div style="width: 52px; height: 52px; border-radius: 16px; background-color: #dc2626; display: flex; align-items: center; justify-content: center; font-weight: 900; font-size: 22px; color: #ffffff; box-shadow: 0 10px 25px -5px rgba(220, 38, 38, 0.5); border: 1px solid rgba(254, 202, 202, 0.2);">
            CB
          </div>
          <div>
            <div style="font-weight: 800; font-size: 18px; color: #f4f4f5; letter-spacing: -0.02em;">THE COMEDY BUTTON</div>
            <div style="font-size: 12px; color: #a1a1aa; font-weight: 500;">24/7 Live Radio & Archive</div>
          </div>
        </div>
        <div style="width: 140px; height: 4px; background: rgba(39, 39, 42, 0.8); border-radius: 9999px; overflow: hidden; position: relative;">
          <div style="width: 50%; height: 100%; background: linear-gradient(90deg, #dc2626, #f59e0b); border-radius: 9999px; animation: cb-splash-slide 1.2s cubic-bezier(0.4, 0, 0.2, 1) infinite;"></div>
        </div>
        <style>
          @keyframes cb-splash-slide {
            0% { transform: translateX(-100%); }
            100% { transform: translateX(250%); }
          }
        </style>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
