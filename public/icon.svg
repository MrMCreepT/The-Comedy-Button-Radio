<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Background Vignette -->
    <radialGradient id="bgGrad" cx="50%" cy="50%" r="50%" fx="50%" fy="50%">
      <stop offset="0%" stop-color="#181c28"/>
      <stop offset="100%" stop-color="#0e111a"/>
    </radialGradient>

    <!-- Outer Metallic Bevel -->
    <linearGradient id="metallicOuter" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#f5f5f5"/>
      <stop offset="25%" stop-color="#d4d4d8"/>
      <stop offset="70%" stop-color="#71717a"/>
      <stop offset="100%" stop-color="#3f3f46"/>
    </linearGradient>

    <!-- Metallic Rim Depth -->
    <radialGradient id="metallicRim" cx="50%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.8"/>
      <stop offset="50%" stop-color="#a1a1aa"/>
      <stop offset="100%" stop-color="#27272a"/>
    </radialGradient>

    <!-- Glossy Red Button Gradient -->
    <radialGradient id="redButton" cx="50%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#ff4444"/>
      <stop offset="45%" stop-color="#dc2626"/>
      <stop offset="85%" stop-color="#991b1b"/>
      <stop offset="100%" stop-color="#5a0d0d"/>
    </radialGradient>

    <!-- Top Specular Gloss Highlight -->
    <linearGradient id="topGloss" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.75"/>
      <stop offset="60%" stop-color="#ffffff" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>

    <!-- Button Drop Shadow -->
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="16" stdDeviation="20" flood-color="#000000" flood-opacity="0.6"/>
    </filter>
  </defs>

  <!-- Background Base -->
  <rect width="512" height="512" rx="108" fill="url(#bgGrad)" />

  <!-- Shadow below metallic bezel -->
  <circle cx="256" cy="272" r="195" fill="#000000" opacity="0.5" filter="blur(16px)" />

  <!-- Metallic Outer Beveled Bezel Ring -->
  <circle cx="256" cy="256" r="195" fill="url(#metallicOuter)" />
  <circle cx="256" cy="256" r="186" fill="url(#metallicRim)" />

  <!-- Recessed Rim Shadow -->
  <circle cx="256" cy="256" r="172" fill="#18181b" />

  <!-- Glossy Red 3D Button Core -->
  <circle cx="256" cy="256" r="164" fill="url(#redButton)" />

  <!-- Specular Reflection Arc -->
  <path d="M 120 230 C 135 150, 377 150, 392 230 C 350 175, 162 175, 120 230 Z" fill="url(#topGloss)" />

  <!-- Center Icon: Bold 'CB' Monogram + On-Air Radio Soundwaves -->
  <g transform="translate(256, 260) scale(1.15)">
    <!-- Radio On-Air Waves Top Accent -->
    <path d="M -45 -62 A 50 50 0 0 1 45 -62" fill="none" stroke="#fecaca" stroke-width="6" stroke-linecap="round" opacity="0.8"/>
    <path d="M -30 -52 A 35 35 0 0 1 30 -52" fill="none" stroke="#ffffff" stroke-width="5" stroke-linecap="round" opacity="0.95"/>
    <circle cx="0" cy="-44" r="5" fill="#ffffff"/>

    <!-- 'CB' Monogram Text with 3D Drop Effect -->
    <text x="0" y="32"
          text-anchor="middle"
          fill="#520505"
          font-family="system-ui, -apple-system, 'Rubik', 'Fredoka', 'Bungee', sans-serif"
          font-size="88"
          font-weight="900"
          letter-spacing="-1">
      CB
    </text>
    <text x="0" y="28"
          text-anchor="middle"
          fill="#ffffff"
          font-family="system-ui, -apple-system, 'Rubik', 'Fredoka', 'Bungee', sans-serif"
          font-size="88"
          font-weight="900"
          letter-spacing="-1">
      CB
    </text>

    <!-- Sub-label: RADIO -->
    <rect x="-42" y="44" width="84" height="20" rx="6" fill="#18181b" opacity="0.85"/>
    <text x="0" y="58"
          text-anchor="middle"
          fill="#f87171"
          font-family="system-ui, -apple-system, sans-serif"
          font-size="12"
          font-weight="900"
          letter-spacing="3">
      RADIO
    </text>
  </g>
</svg>